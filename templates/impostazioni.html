<!DOCTYPE html>
<html lang="it-IT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="/static/sidebar.css" rel="stylesheet">
    <link href="/static/base.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <title>Impostazioni</title>
  </head>
  <body class="m-2" x-data="{ route: window.location.hash.substring(1) || 'sys_op' }" x-init="
    window.addEventListener('hashchange', () => {
      route = location.hash.substring(1)
    })
  ">
    <script src="/static/sidebar.js"></script>
    <script src="/static/impostazioni.js"></script>
    <div class="d-flex flex-column flex-shrink-0 p-3" style="width: 280px;" x-data="sidebarData()" id="sidebar">
      <a class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
        <strong><span class="fs-4 scritta">Impostazioni</span></strong>
      </a>
      <hr>
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
          <a class="nav-link" :class="{ 'active': route === 'sys_op' }" href="#sys_op">
            <span class="material-symbols-outlined">dns</span> System Option
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" :class="{ 'active': route === 'utenze' }" href="#utenze">
            <span class="material-symbols-outlined">group</span> Utenze e Gruppi
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" :class="{ 'active': route === 'eventi' }" href="#eventi">
            <span class="material-symbols-outlined">festival</span> Tipi Eventi
          </a>
        </li>
      </ul>
      <hr>
      <a class="btn btn-sm btn-primary" href="{{ url_for("dashboard") }}"><span class="material-symbols-outlined">arrow_back</span></a>
    </div>


<main>

<div id="sys_op" x-show="route === 'sys_op'">
  <form  x-data="system_optionForm()" @submit.prevent="submitForm" x-init="loadData()">
    <button type="button" class="btn btn-sm btn-primary" @click=loadData() id="refresh_sys"><span class="material-symbols-outlined">refresh</span></button>
    <button type="button" class="btn btn-sm btn-primary" @click=submitForm() id="upgrade_sys" :disabled="formLoading"><span class="material-symbols-outlined">upgrade</span></button>
    <div class="mt-2">
      <table class="table table-sm table-responsive">
        <tbody>
          <tr>
            <th scope="row"><span class="scritta">Nome Ente</span></th>
            <td><input type="text" class="form-control" id="nome" x-model="formData.id_ente"></td>
          </tr>
          <tr>
            <th scope="row"><span class="scritta">Nome Incaricato</span></th>
            <td><input type="text" class="form-control" id="nome" x-model="formData.nome_iro"></td>
          </tr>
          <tr>
            <th scope="row"><span class="scritta">Cognome Incaricato</span></th>
            <td><input type="text" class="form-control" id="nome" x-model="formData.cognome_iro"></td>
          </tr>
          <tr>
            <th scope="row"><span class="scritta">SMTP Server</span></th>
            <td><input type="text" class="form-control" id="nome" x-model="formData.smtp_server"></td>
          </tr>
          <tr>
            <th scope="row"><span class="scritta">SMTP Port</span></th>
            <td><input type="text" class="form-control" id="nome" x-model="formData.smtp_port"></td>
          </tr>
          <tr>
            <th scope="row"><span class="scritta">Indirizzo Mail</span></th>
            <td><input type="text" class="form-control" id="nome" x-model="formData.mail_indirizzo"></td>
          </tr>
          <tr>
            <th scope="row"><span class="scritta">Password Mail</span></th>
            <td><input type="text" class="form-control" id="nome" x-model="formData.mail_passwd"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </form>
</div>

<div id="utenze" x-show="route === 'utenze'">
  <h4 class="text-center">Utenze e Gruppi</h4>
</div>

<div id="eventi" x-show="route === 'eventi'" x-data="tipi_eventi()">
  <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#tipiModal" data-bs-paraid="">Aggiungi</button>
  <button type="button" class="btn btn-sm btn-primary" @click=refreshEventi() id="refresh_eventi"><span class="material-symbols-outlined">refresh</span></button>
  <table class="table table-responsive">
    <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Nome</th>
        <th scope="col"></th>
      </tr>
    </thead>
    <tbody>
        <template x-for="i in elenco_eventi.response">
          <tr>
            <th scope="row" x-text="i.id"></th>
            <td x-text="i.nome"></td>
            <td>
            <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#tipiModal" x-bind:data-bs-tipoid="i.id"><span class="material-symbols-outlined">edit</span></button>
            <button type="button" class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#tipiDeleteModal" x-bind:data-bs-tipoid="i.id"><span class="material-symbols-outlined">delete</span></button>
            </td>
          </tr>
        </template>
    </tbody>
  </table>
</div>

</main>

    <div class="modal fade" id="tipiModal" tabindex="-1" aria-labelledby="tipiModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="tipiModalLabel">Tipo Evento</h1>
          </div>
          <div class="modal-body mx-2">
            <form  x-data="tipiEventiForm()" @submit.prevent="submitForm">
              <input type="text" class="form-control" hidden id="tipo_id" x-model="formData.tipo_id">
              <div class="mb-3 row">
                  <label for="nome" class="form-label">Nome</label>
                  <input type="text" class="form-control" id="nome" x-model="formData.nome">
              </div>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
              <button type="submit" class="btn btn-primary" :disabled="formLoading" data-bs-dismiss="modal">Conferma</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="tipiDeleteModal" tabindex="-1" aria-labelledby="tipiDeleteModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="tipiDeleteModalLabel">Elimina Tipo</h1>
          </div>
          <div class="modal-body mx-2">
            <form  x-data="paracadutistiDeleteForm()" @submit.prevent="submitForm">
              <input type="text" class="form-control" hidden id="tipo_id" x-model="formData.tipo_id">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
              <button type="submit" class="btn btn-danger" :disabled="formLoading" data-bs-dismiss="modal">Elimina</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  </body>
</html>
